name: Build MacOS App with Nuitka

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Cài thêm zstandard để Nuitka nén và biên dịch hiệu quả hơn
        python -m pip install nuitka PyQt6 undetected-chromedriver selenium cryptography pyperclip zstandard

    - name: Build with Nuitka
      run: |
        # --confirm-external-download: Tự động tải các tool biên dịch cần thiết mà không chờ người dùng nhấn xác nhận
        # --collect-all: Đảm bảo gom đủ toàn bộ tài nguyên của thư viện undetected-chromedriver
        python -m nuitka --standalone \
                         --macos-create-app-bundle \
                         --enable-plugin=pyqt6 \
                         --collect-all=undetected_chromedriver \
                         --confirm-external-download \
                         dichmac.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DichMac-MacOS-App
        path: dichmac.app/
