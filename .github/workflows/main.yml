name: Build MacOS App with Nuitka (PySide6)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Cho phép bấm nút chạy thủ công từ giao diện GitHub

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build with Nuitka
      run: |
        # Biên dịch sang app máy Mac, gộp PySide6, nén package ẩn và tích hợp icon.ico
        python3 -m nuitka --standalone \
                          --macos-create-app-bundle \
                          --macos-app-icon=icon.ico \
                          --enable-plugin=pyside6 \
                          --include-package=undetected_chromedriver \
                          --assume-yes-for-downloads \
                          --output-dir=dist \
                          dichmac.py

    - name: Compress App Bundle
      run: |
        # Bắt buộc nén thủ công với tham số -ry để giữ lại symlink (đường dẫn ảo) 
        # và quyền thực thi chạy app của hệ điều hành macOS
        cd dist
        zip -ry DichMac-MacOS.zip "dichmac.app"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DichMac-MacOS-App
        path: dist/DichMac-MacOS.zip
