name: Build MacOS App with Nuitka

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Cài đặt đầy đủ thư viện cần thiết cho tool dubbing video của bạn
        pip install nuitka PyQt6 undetected-chromedriver selenium cryptography pyperclip zstandard ordered-set

    - name: Verify files
      run: ls -R # Lệnh này để kiểm tra xem file dichmac.py có thực sự nằm ở thư mục gốc không

    - name: Build with Nuitka
      run: |
        # --quiet: Giảm bớt log thừa để dễ theo dõi lỗi chính
        # --assume-yes-for-downloads: Tương đương confirm-external-download
        python -m nuitka --standalone \
                         --macos-create-app-bundle \
                         --enable-plugin=pyqt6 \
                         --collect-all=undetected_chromedriver \
                         --assume-yes-for-downloads \
                         dichmac.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DichMac-MacOS-App
        path: dichmac.app/
