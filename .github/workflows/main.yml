name: Build MacOS App with Nuitka (PySide6)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build with Nuitka
      run: |
        # Dùng PySide6 để Nuitka biên dịch mã máy C mượt mà trên Mac
        python3 -m nuitka --standalone \
                          --macos-create-app-bundle \
                          --enable-plugin=pyside6 \
                          --include-package=undetected_chromedriver \
                          --assume-yes-for-downloads \
                          --output-dir=dist \
                          dichmac.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DichMac-MacOS-App
        path: dist/dichmac.app/
